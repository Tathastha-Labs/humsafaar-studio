name: Build installers

# Builds Humsafaar Studio installers for macOS, Windows and Linux. Run it from the Actions tab
# ("Run workflow"), push a tag like v0.42.0, or push code changes to main. The installers are attached
# to the run as artifacts. Builds from main keep the Rust and npm caches that tag builds restore, so
# a tag build after a main build is much quicker.
# They are not code-signed: macOS and Windows will warn on first open until signing is added.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "crates/**"
      - "frontend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/installers.yml"

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: aarch64-apple-darwin
          - name: macos-intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: x86_64-apple-darwin
          - name: windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # Compiled Rust packages and the Tauri tool, kept per platform between runs.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libxdo-dev cmake clang nasm pkg-config build-essential

      - name: Windows build tools
        if: matrix.os == 'windows-latest'
        run: |
          choco install cmake -y
          choco install strawberryperl -y
          choco install pkgconfiglite -y
          choco install llvm -y
          choco install nasm -y
        shell: cmd

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_ENVIRONMENT_TYPE: production
        run: npx nx run humsafaar:build

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the installers
        working-directory: crates/desktop/humsafaar
        env:
          SQLX_OFFLINE: "true"
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
        # The frontend is already built above.
        run: cargo tauri build ${{ matrix.args }} --config '{"build":{"beforeBuildCommand":""}}'

      - uses: actions/upload-artifact@v7
        with:
          name: humsafaar-studio-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage
